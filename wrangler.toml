name = "withered-pine-ee0b"
compatibility_date = "2026-09-12"
main = "src/index.js"
# Browser push is opt-in. Supply all three values to the production Worker
# without committing them: wrangler secret put VAPID_PUBLIC_KEY, then
# VAPID_PRIVATE_KEY and VAPID_SUBJECT. The app keeps inbox delivery available
# until the complete set is present.
[assets]
directory = ".worker-dist"
binding = "ASSETS"
run_worker_first = ["/api/portal", "/api/portal/*", "/portal", "/portal/*"]

[[d1_databases]]
binding = "PORTAL_DB"
database_name = "adplix-portal"
database_id = "8c440209-ebd1-4a1f-a761-93a749952104"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "PORTAL_PASSWORDS"
class_name = "PortalPasswordHasher"

[[migrations]]
tag = "v1-password-hasher"
new_sqlite_classes = ["PortalPasswordHasher"]
